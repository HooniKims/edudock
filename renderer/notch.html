<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>업무 도우미</title>
  <link rel="stylesheet" href="notch.css">
  <script src="notch.js" defer></script>
</head>
<body data-edge="right" data-state="collapsed">
  <svg class="shape" id="shape" aria-hidden="true"><g id="shape-offset"><g id="shape-transform"><path id="shape-path"></path></g></g></svg>
  <button class="placement-handle move-handle" data-placement-mode="move" aria-label="노치 위치 이동" type="button"><span aria-hidden="true"></span></button>
  <button class="placement-handle resize-handle" data-placement-mode="resize" aria-label="노치 크기 조절" type="button"><span aria-hidden="true"></span></button>
  <nav class="actions" aria-label="빠른 업무">
    <button data-button="neis" data-menu="neis" aria-label="나이스"><svg viewBox="0 0 24 24"><path d="m3 9 9-6 9 6M5 10v10h14V10M9 20v-6h6v6M3 21h18"/></svg></button>
    <button data-button="edufine" data-menu="edufine" aria-label="K-에듀파인"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zm0 0v6h6M8 13h8m-8 4h5"/></svg></button>
    <button data-button="attendance" data-menu="attendance" aria-label="개인근무상황"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5 3 3 5-5"/></svg></button>
    <button data-button="trip" data-menu="trip" aria-label="출장 신청"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V4h8v3M3 12a23 23 0 0 0 18 0m-11 1v3h4v-3"/></svg></button>
    <button data-button="draft" data-menu="draft" aria-label="일반기안"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zm0 0v6h6M8 13h8m-8 4h5"/></svg></button>
    <button data-button="compose" data-auxiliary="draft" aria-label="초안 만들기"><svg viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7a2.1 2.1 0 0 0-5-5L4 14zM4 14l5 5M3 22h18"/></svg></button>
    <button data-auxiliary="settings" aria-label="설정"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </nav>
  <button id="status-button" aria-label="현재 작업 상태"><span id="status-dot" aria-hidden="true"></span></button>
  <p id="live-status" role="status" aria-live="polite">업무를 선택하면 Edge에서 이어집니다.</p>
</body>
</html>
