<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>업무 곁 세션 유지</title>
  <style>
    body{margin:0;width:320px;font:13px 'Malgun Gothic',sans-serif;color:#202a3c;background:#f1f4f9}
    header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid #d9dfea}
    header img{width:28px;height:28px}
    header strong{font-size:14px}
    main{padding:14px 16px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid #d9dfea;border-radius:12px;padding:12px 14px}
    .row small{display:block;color:#46526a;margin-top:3px;line-height:1.5}
    .switch{appearance:none;width:42px;height:26px;border-radius:999px;background:#cbd3e0;position:relative;cursor:pointer;flex:none}
    .switch:after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
    .switch:checked{background:#2361ce}.switch:checked:after{transform:translateX(16px)}
    .buttons{display:flex;gap:8px;margin:10px 0}
    button{flex:1;border:0;border-radius:10px;padding:8px;background:#e3e9f5;color:#2361ce;font:600 12px inherit;cursor:pointer}
    h2{font-size:12px;color:#46526a;margin:12px 0 6px}
    ul{list-style:none;margin:0;padding:0;max-height:180px;overflow:auto;background:#fff;border:1px solid #d9dfea;border-radius:10px}
    li{padding:7px 10px;border-top:1px solid #eef1f6;font-size:11.5px;line-height:1.5}
    li:first-child{border-top:0}
    .ok{color:#257562}.miss{color:#906121}.err{color:#b23c1f}
    .row + .row{margin-top:10px} .hint{font-size:11px;line-height:1.5;color:#46526a} button:disabled{opacity:.6;cursor:wait}
    footer{padding:0 16px 12px;color:#5d687c;font-size:11px;text-align:center}
  </style>
</head>
<body>
  <header><img src="icon-48.png" alt=""><strong>업무 곁 세션 유지</strong></header>
  <main>
    <label class="row"><span><strong>세션 유지</strong><small>열어 둔 업무포털·K-에듀파인 탭의 세션 연장 버튼을 4분마다 뒤에서 눌러요.</small></span><input id="enabled" class="switch" type="checkbox"></label>
    <label class="row"><span><strong>나이스도 포함</strong><small>접근을 허용한 뒤 기본 세션을 함께 연장해요. 위의 세션 유지가 켜져 있을 때 자동 실행됩니다.</small></span><input id="neis" class="switch" type="checkbox"></label>
    <p class="hint">2차 인증은 나이스에서 직접 연장해 주세요. 오류가 뜨거나 세션이 끝나면 시간을 초기화하지 않습니다. 이미 끝난 세션은 다시 로그인해야 합니다.</p>
    <div class="buttons"><button id="run">지금 연장</button></div>
    <p id="message" class="hint" role="status"></p>
    <h2>최근 기록</h2>
    <ul id="log"></ul>
  </main>
  <footer>by HooniKim · 등촌중학교 김형훈</footer>
  <script src="popup.js"></script>
</body>
</html>
