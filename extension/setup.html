<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>업무 곁 세션 유지 · 처음 설정</title>
  <style>
    :root{--ink:#202a3c;--sub:#46526a;--line:#d9dfea;--blue:#2361ce;--pale:#e8effe;--bg:#f1f4f9;--ok:#257562;--warn:#906121}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:start center;padding:48px 16px;background:var(--bg);color:var(--ink);font:15px/1.6 'Malgun Gothic',sans-serif;word-break:keep-all}
    main{width:min(640px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 32px 28px;box-shadow:0 12px 32px rgba(40,60,100,.08)}
    header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    header img{width:40px;height:40px}
    h1{margin:0;font-size:22px;letter-spacing:-.4px}
    header p{margin:2px 0 0;color:var(--sub);font-size:13px}
    .step{display:flex;gap:12px;align-items:baseline;margin:24px 0 12px}
    .step b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;flex:none}
    .step h2{margin:0;font-size:17px}
    #grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
    #grid button{border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:12px 0;font:600 15px 'Malgun Gothic',sans-serif;cursor:pointer}
    #grid button:hover{border-color:var(--blue);color:var(--blue)}
    #grid button[aria-checked="true"]{border-color:var(--blue);background:var(--blue);color:#fff}
    #grid button:focus-visible,#allow:focus-visible{outline:3px solid #8fb4f5;outline-offset:2px}
    #allow{display:block;width:100%;margin-top:8px;border:0;border-radius:14px;padding:16px;background:var(--blue);color:#fff;font:700 17px 'Malgun Gothic',sans-serif;cursor:pointer;box-shadow:0 6px 16px rgba(35,97,206,.25)}
    #allow:disabled{background:#9db3dd;box-shadow:none;cursor:default}
    .hint{margin:10px 0 0;color:var(--sub);font-size:13.5px}
    .hint strong{color:var(--ink)}
    #result{margin:18px 0 0;padding:14px 16px;border-radius:12px;font-size:14.5px;display:none}
    #result.ok{display:block;background:#e7f4ef;color:var(--ok)}
    #result.warn{display:block;background:#f6eddd;color:var(--warn)}
    footer{margin-top:24px;color:#5d687c;font-size:12px;text-align:center}
    @media(max-width:520px){#grid{grid-template-columns:repeat(4,1fr)}main{padding:24px 18px}}
  </style>
</head>
<body>
  <main>
    <header><img src="icon-48.png" alt=""><div><h1>업무 곁 세션 유지 · 처음 설정</h1><p>열어 둔 업무포털·K-에듀파인·나이스 탭의 로그인 시간을 4분마다 늘려 줍니다.</p></div></header>

    <div class="step"><b>1</b><h2>쓰시는 교육청을 고르세요</h2></div>
    <div id="grid" role="radiogroup" aria-label="교육청"></div>

    <div class="step"><b>2</b><h2>사용을 허용하세요</h2></div>
    <button id="allow" type="button" disabled>교육청을 먼저 골라 주세요</button>
    <p class="hint">Edge가 권한 창을 띄우면 <strong>[허용]</strong>을 직접 눌러 주세요. 기본 선택이 [거부]라서 Enter를 누르면 거부됩니다.</p>
    <p class="hint">허용하면 고른 교육청의 업무포털·K-에듀파인·나이스 사이트에서만 동작합니다. 비밀번호와 인증서는 읽지 않습니다.</p>

    <p id="result" role="status" aria-live="polite"></p>
  </main>
  <footer>by HooniKim · 등촌중학교 김형훈 · 교육청을 바꾸려면 Edge 오른쪽 위 확장 아이콘을 누르세요.</footer>
  <script src="regions.js"></script>
  <script src="setup.js"></script>
</body>
</html>
